# ==============================================================================
# CivicVision AI — Docker Compose Orchestration (Windows & Linux Compatible)
# ==============================================================================
#
# Architecture Notes:
#  1. SQLite is preserved as the sole database engine.
#  2. Production database (backend/civicsense.db) and uploads are mounted from host.
#  3. Trained model weights (YOLO, Random Forest, Decision Tree) are mounted read-only.
#  4. Frontend (Nginx) proxies /api and /uploads to the internal backend container.
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: civicvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=CivicVision AI
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY:-civicvision_ai_super_secret_jwt_key_2026_change_in_production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=sqlite:////app/backend/civicsense.db
      - WEIGHT_CATEGORY=0.35
      - WEIGHT_CONFIDENCE=0.15
      - WEIGHT_DEFECT_AREA=0.15
      - WEIGHT_DUPLICATES=0.20
      - WEIGHT_AGING=0.15
      - DUPLICATE_RADIUS_METERS=50.0
      - DUPLICATE_TIME_WINDOW_HOURS=72.0
    volumes:
      # Persistent SQLite Database mount (host persistent file)
      - ./backend/civicsense.db:/app/backend/civicsense.db
      # Persistent uploads directory mount
      - ./backend/uploads:/app/backend/uploads
      # Read-only model artifacts mounts to guarantee protection against mutation
      - ./backend/app/ai_model/yolo/weights:/app/backend/app/ai_model/yolo/weights:ro
      - ./backend/app/ai_model/random_forest/weights:/app/backend/app/ai_model/random_forest/weights:ro
      - ./backend/app/ai_model/decision_tree/weights:/app/backend/app/ai_model/decision_tree/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: civicvision-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
